<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview B — Cooler Background, Purple Accent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@400;500&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Option B — cooled background to harmonize with purple accent */
      --bg:        #eceaf0;   /* parchment + lavender tint — meets the purple halfway */
      --surface:   #f7f6fb;   /* cooler near-white */
      --surface-2: #e3e1ea;
      --border:    #d6d4de;
      --border-2:  #c0bece;
      --text:      #26242e;   /* near-black with slight violet undertone */
      --text-2:    #6a6775;
      --text-3:    #9e9bab;
      --accent:    #a134c9;   /* original purple — now the bg speaks its language */
      --accent-a10: rgba(161,52,201,0.10);
      --accent-a28: rgba(161,52,201,0.28);
      --accent-a40: rgba(161,52,201,0.40);
      --green:     #3f8a52;
      --green-a14: rgba(63,138,82,0.14);
      --green-a40: rgba(63,138,82,0.40);
      --red:       #bf5250;
      --red-a20:   rgba(191,82,80,0.20);
      --red-a40:   rgba(191,82,80,0.40);
      --radius:    14px;
      --sub-font:  2.0rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem;
      max-width: 480px;
      margin: 0 auto;
    }

    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 1rem;
    }

    /* Header */
    .demo-header {
      background: var(--bg);
      padding: 0.875rem 0 0.875rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .tagline {
      font-family: 'Shippori Mincho', serif;
      font-size: 1.05rem;
      letter-spacing: 0.18em;
      line-height: 1;
    }
    .tl-word  { font-weight: 500; color: var(--text); }
    .tl-particle {
      font-weight: 400;
      color: var(--accent);
      opacity: 0.9;
      font-size: 0.78em;
    }
    .tab-row { display: flex; gap: 0.25rem; }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.25rem 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-3);
      cursor: pointer;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

    /* Episode info */
    .episode-info {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      padding: 0.6rem 0.875rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1rem;
    }
    .episode-info-show {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--green);
      opacity: 0.75;
    }
    .episode-info-ep { font-size: 1rem; font-weight: 300; color: var(--text); }

    /* Subtitle scroll */
    .subtitle-wrap { position: relative; margin-bottom: 1rem; }
    .subtitle-wrap::before {
      content: '';
      position: absolute;
      top: 0; left: 20%; right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
      z-index: 2;
      pointer-events: none;
    }
    .subtitle-scroll {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem 0;
      overflow: hidden;
    }
    .fade-top, .fade-bottom {
      position: absolute; left: 0; right: 0; height: 4rem; pointer-events: none; z-index: 1;
    }
    .fade-top    { top: 0;    background: linear-gradient(to bottom, var(--surface), transparent); border-radius: 20px 20px 0 0; }
    .fade-bottom { bottom: 0; background: linear-gradient(to top,    var(--surface), transparent); border-radius: 0 0 20px 20px; }

    .sub-item {
      display: flex;
      align-items: stretch;
      opacity: 0.28;
    }
    .sub-item.active { opacity: 1; }
    .sub-item.adjacent { opacity: 0.55; }
    .sub-jump {
      flex-shrink: 0; width: 14px; position: relative; margin: 0.3rem 0;
    }
    .sub-jump::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 2px;
      background: var(--border-2);
      border-radius: 1px;
    }
    .sub-item.active .sub-jump::after { background: var(--accent); opacity: 0.7; }
    .sub-content { flex: 1; min-width: 0; padding: 0.55rem 0.5rem; }
    .sub-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      color: var(--green);
      opacity: 0.35;
      letter-spacing: 0.15em;
      margin-bottom: 0.15rem;
    }
    .sub-item.active .sub-time { opacity: 0.65; }
    .sub-text {
      font-family: 'Shippori Mincho', serif;
      font-size: var(--sub-font);
      line-height: 1.85;
      color: var(--text);
      font-weight: 400;
    }
    .sub-item.active .sub-text { font-weight: 500; }

    /* Controls */
    .controls-row {
      display: flex; align-items: center; gap: 0.45rem; margin-bottom: 1.25rem;
    }
    .ctrl-spacer { flex: 1; }
    .ctrl-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 0.85rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-2);
      cursor: pointer;
    }
    .ctrl-btn-sm {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0.6rem 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      color: var(--text-3);
      cursor: pointer;
    }
    .play-btn {
      background: var(--surface-2);
      border-color: var(--border-2);
      width: 4.5rem;
      padding: 0.75rem 0;
      text-align: center;
      font-size: 1.05rem;
      color: var(--text);
    }

    /* Words card */
    .words-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      margin-bottom: 0.6rem;
      overflow: hidden;
    }
    .words-card-header {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.6rem;
    }
    .words-toggle-btn {
      flex-shrink: 0;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-2);
      cursor: pointer;
    }
    .words-toggle-btn.on {
      background: var(--accent-a10);
      border-color: var(--accent-a40);
      color: var(--accent);
    }
    .word-add-btn {
      flex-shrink: 0;
      margin-left: auto;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-2);
      cursor: pointer;
    }

    /* Toggle row */
    .toggle-row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
    .toggle-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      color: var(--text-3);
      letter-spacing: 0.12em;
      cursor: pointer;
      text-transform: uppercase;
      text-align: center;
    }
    .toggle-btn.on {
      background: var(--accent-a10);
      border-color: var(--accent-a40);
      color: var(--accent);
    }

    /* Palette swatch row */
    .swatches {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .swatch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }
    .swatch-box {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.08);
    }
    .swatch-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.45rem;
      color: var(--text-3);
      letter-spacing: 0.05em;
      text-align: center;
    }
  </style>
</head>
<body>

  <p class="label">Option B — Purple Accent · Lavender-Tinted Background</p>

  <div class="demo-header">
    <p class="tagline">
      <span class="tl-word">音声</span><span class="tl-particle">から</span><span class="tl-word">言葉</span><span class="tl-particle">へ</span>
    </p>
    <div class="tab-row">
      <button class="tab-btn active">Player</button>
      <button class="tab-btn">Library</button>
    </div>
  </div>

  <div class="episode-info">
    <span class="episode-info-show">ゆる言語学ラジオ</span>
    <span class="episode-info-ep">Episode 42 — 言語の起源</span>
  </div>

  <div class="subtitle-wrap">
    <div class="subtitle-scroll">
      <div class="sub-item">
        <div class="sub-jump"></div>
        <div class="sub-content">
          <div class="sub-time">00:12.4</div>
          <div class="sub-text">それは面白い質問ですね。</div>
        </div>
      </div>
      <div class="sub-item adjacent">
        <div class="sub-jump"></div>
        <div class="sub-content">
          <div class="sub-time">00:15.1</div>
          <div class="sub-text">言語というのは、人間にとって</div>
        </div>
      </div>
      <div class="sub-item active">
        <div class="sub-jump"></div>
        <div class="sub-content">
          <div class="sub-time">00:18.7</div>
          <div class="sub-text">本当に根本的なものだと思います。</div>
        </div>
      </div>
      <div class="sub-item adjacent">
        <div class="sub-jump"></div>
        <div class="sub-content">
          <div class="sub-time">00:22.0</div>
          <div class="sub-text">でも、その起源については</div>
        </div>
      </div>
      <div class="sub-item">
        <div class="sub-jump"></div>
        <div class="sub-content">
          <div class="sub-time">00:24.8</div>
          <div class="sub-text">まだよくわかっていないんです。</div>
        </div>
      </div>
    </div>
    <div class="fade-top"></div>
    <div class="fade-bottom"></div>
  </div>

  <div class="controls-row">
    <div class="ctrl-spacer"></div>
    <button class="ctrl-btn-sm">−10s</button>
    <button class="ctrl-btn">←sub</button>
    <button class="ctrl-btn play-btn">▶</button>
    <button class="ctrl-btn">sub→</button>
    <button class="ctrl-btn-sm">+10s</button>
    <div class="ctrl-spacer"></div>
  </div>

  <div class="words-card">
    <div class="words-card-header">
      <button class="words-toggle-btn on">Words (3)</button>
      <button class="word-add-btn">+ Word</button>
    </div>
  </div>

  <div class="toggle-row">
    <button class="toggle-btn on">↻ Loop Curr Sub</button>
    <button class="toggle-btn">|| Pause Each Sub</button>
  </div>

  <!-- Palette reference -->
  <div class="swatches">
    <div class="swatch"><div class="swatch-box" style="background:#eceaf0"></div><div class="swatch-name">bg</div></div>
    <div class="swatch"><div class="swatch-box" style="background:#f7f6fb"></div><div class="swatch-name">surface</div></div>
    <div class="swatch"><div class="swatch-box" style="background:#a134c9"></div><div class="swatch-name">accent</div></div>
    <div class="swatch"><div class="swatch-box" style="background:#3f8a52"></div><div class="swatch-name">green</div></div>
    <div class="swatch"><div class="swatch-box" style="background:#bf5250"></div><div class="swatch-name">red</div></div>
    <div class="swatch"><div class="swatch-box" style="background:#26242e"></div><div class="swatch-name">text</div></div>
  </div>

</body>
</html>
